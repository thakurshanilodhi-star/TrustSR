[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustsr"
version = "0.3.0"
description = "Research prototype for trust-aware state recovery in agent systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
labs = ["networkx>=3.0", "pandas>=2.0", "matplotlib>=3.7", "numpy>=1.24", "jupyter"]
kernel = ["nbclient>=0.10", "nbformat>=5.9", "ipykernel>=6.29"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not notebook'"
markers = ["notebook: slow notebook smoke tests; run explicitly with pytest -m notebook"]
